<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>スマートFIRE 自己理解診断｜あおいのスマートFIRE</title>
  <meta name="description" content="8つの回答を重ね、今の関心を別の角度から整理するスマートFIRE自己理解レポートです。">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23fbfaf7'/%3E%3Cpath d='M8 20c5-8 11-8 16-1' fill='none' stroke='%2334465f' stroke-width='3' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='13' r='4' fill='%23a58b57'/%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #fbfaf7;
      --bg-soft: #f5f1ea;
      --text: #202733;
      --muted: #616b78;
      --line: #e4ded3;
      --line-strong: #d3c9b6;
      --navy: #34465f;
      --navy-deep: #24344a;
      --brass: #a58b57;
      --brass-deep: #8a713f;
      --brass-soft: rgba(165, 139, 87, 0.12);
      --card: rgba(255, 255, 255, 0.66);
      --shadow: 0 16px 44px rgba(36, 52, 74, 0.045);
      --radius: 5px;
      --serif: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", serif;
      --sans: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "YuGothic", "Meiryo", sans-serif;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      color: var(--text);
      background: linear-gradient(180deg, var(--bg) 0%, var(--bg-soft) 100%);
      background-attachment: fixed;
      font-family: var(--sans);
      line-height: 2;
      letter-spacing: 0.02em;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button { font: inherit; cursor: pointer; }

    button:focus-visible {
      outline: 2px solid var(--brass);
      outline-offset: 3px;
    }

    .page {
      width: min(100%, 640px);
      margin: 0 auto;
      padding: 24px 22px 64px;
    }

    .site-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 8px 0 18px;
      border-bottom: 1px solid var(--line);
    }

    .site-header .brand {
      color: var(--navy);
      font-family: var(--serif);
      font-size: 0.95rem;
      letter-spacing: 0.12em;
    }

    .site-header .brand-en {
      color: var(--brass);
      font-size: 0.68rem;
      letter-spacing: 0.28em;
    }

    .eyebrow {
      display: block;
      margin-bottom: 16px;
      color: var(--brass);
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.36em;
      text-indent: 0.36em;
    }

    /* ---------- intro ---------- */
    .intro { padding: 74px 0 44px; text-align: center; }

    .intro .eyebrow { margin-bottom: 22px; }

    .intro h1 {
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(1.5rem, 6.5vw, 2.5rem);
      font-weight: 600;
      line-height: 1.7;
      letter-spacing: 0.08em;
      color: var(--navy-deep);
      word-break: keep-all;
      overflow-wrap: anywhere;
      line-break: strict;
    }

    .intro-rule {
      width: 40px;
      height: 1px;
      margin: 30px auto 0;
      background: var(--brass);
      opacity: 0.65;
    }

    .intro .catch {
      margin: 30px 0 0;
      font-family: var(--serif);
      font-size: clamp(1.04rem, 4.2vw, 1.22rem);
      line-height: 2.15;
      color: var(--text);
      letter-spacing: 0.05em;
      word-break: keep-all;
      overflow-wrap: anywhere;
      line-break: strict;
    }

    .intro .sub {
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 0.94rem;
      line-height: 2;
      letter-spacing: 0.04em;
      word-break: keep-all;
      overflow-wrap: anywhere;
      line-break: strict;
    }

    .assure {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 0;
      margin: 32px 0 0;
      padding: 0;
      list-style: none;
      color: var(--muted);
      font-size: 0.78rem;
      letter-spacing: 0.12em;
    }

    .assure li { display: inline-flex; align-items: center; }

    .assure li:not(:first-child)::before {
      content: "／";
      margin: 0 0.7em;
      color: var(--brass);
      opacity: 0.7;
    }

    .intro .greeting {
      margin: 30px 0 0;
      padding-top: 22px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.92rem;
    }

    .start-area { margin: 42px 0 0; }

    /* ---------- buttons ---------- */
    .btn-primary,
    .btn-secondary {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      min-height: 58px;
      padding: 15px 24px;
      border-radius: var(--radius);
      border: 1px solid transparent;
      font-weight: 600;
      letter-spacing: 0.14em;
      line-height: 1.5;
      transition: background-color 0.25s ease, border-color 0.25s ease, color 0.25s ease;
    }

    .btn-primary {
      color: #fbfaf7;
      background: var(--navy-deep);
      border-color: var(--navy-deep);
    }

    .btn-primary:hover { background: #1b2839; border-color: #1b2839; }

    .start-area .btn-primary {
      width: min(100%, 340px);
      box-shadow: 0 10px 30px rgba(36, 52, 74, 0.12);
    }

    .btn-secondary {
      color: var(--navy);
      background: transparent;
      border-color: var(--line-strong);
    }

    .btn-secondary:hover { border-color: var(--brass); color: var(--brass-deep); }

    .btn-ghost {
      display: inline-block;
      margin-top: 18px;
      padding: 8px 4px;
      border: none;
      background: none;
      color: var(--muted);
      font-size: 0.85rem;
      letter-spacing: 0.06em;
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    .btn-ghost:hover { color: var(--navy); }

    /* ---------- quiz ---------- */
    .quiz { padding: 52px 0 24px; }

    .progress-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 12px;
    }

    .progress-count {
      color: var(--navy);
      font-family: var(--serif);
      font-size: 1rem;
      letter-spacing: 0.14em;
    }

    .progress-track {
      height: 3px;
      border-radius: 999px;
      background: var(--line);
      overflow: hidden;
    }

    .progress-fill {
      display: block;
      height: 100%;
      background: var(--brass);
      transition: width 0.3s ease;
    }

    .q-card {
      margin-top: 40px;
      animation: fadeIn 0.32s ease both;
    }

    .q-text {
      margin: 0 0 8px;
      font-family: var(--serif);
      font-size: clamp(1.14rem, 4.7vw, 1.38rem);
      font-weight: 600;
      line-height: 1.95;
      letter-spacing: 0.04em;
      color: var(--navy-deep);
    }

    .q-hint {
      margin: 0 0 26px;
      color: var(--muted);
      font-size: 0.84rem;
      letter-spacing: 0.06em;
    }

    .q-options {
      display: grid;
      gap: 12px;
    }

    .q-option {
      display: block;
      width: 100%;
      padding: 18px 20px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--card);
      color: var(--text);
      font-size: 0.98rem;
      line-height: 1.8;
      text-align: left;
      transition: border-color 0.18s ease, background-color 0.18s ease;
    }

    .q-option:hover { border-color: var(--brass); background: rgba(255, 255, 255, 0.85); }

    .q-option.is-selected {
      border-color: var(--brass);
      background: var(--brass-soft);
      box-shadow: inset 3px 0 0 var(--brass);
    }

    .quiz-nav {
      display: flex;
      justify-content: space-between;
      margin-top: 32px;
    }

    /* ---------- result ---------- */
    .result { padding: 44px 0 10px; }

    .result > .eyebrow { text-align: center; }

    .result-hero {
      padding: 46px 26px 42px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.8), rgba(255, 255, 255, 0.5));
      box-shadow: var(--shadow);
      text-align: center;
    }

    .type-icon {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      width: 72px;
      height: 72px;
      margin-bottom: 22px;
      border: 1px solid var(--brass);
      border-radius: 50%;
      background: transparent;
      color: var(--brass);
    }

    .type-icon svg { width: 38px; height: 38px; }

    .type-name {
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(1.64rem, 6.8vw, 2.2rem);
      font-weight: 600;
      line-height: 1.5;
      letter-spacing: 0.06em;
      color: var(--navy-deep);
    }

    .type-name:focus { outline: none; }

    .type-name .title-segment {
      display: inline-block;
      white-space: nowrap;
    }

    .type-oneliner {
      margin: 18px auto 0;
      max-width: 30em;
      color: var(--text);
      font-size: 0.98rem;
      line-height: 2.05;
    }

    #golden-introduction { text-align: left; }

    .type-summary {
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(1.06rem, 4.3vw, 1.18rem);
      line-height: 2.35;
      letter-spacing: 0.045em;
      color: var(--navy-deep);
    }

    .report-kicker {
      margin: 0 0 12px;
      color: var(--brass-deep);
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.14em;
    }

    .summary-label {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 0.78rem;
      letter-spacing: 0.1em;
    }

    .summary-grid {
      display: grid;
      gap: 12px;
      margin-top: 28px;
      text-align: left;
    }

    .summary-item {
      padding: 18px 18px 16px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.55);
    }

    .summary-value {
      display: block;
      color: var(--navy-deep);
      font-family: var(--serif);
      font-size: 1.02rem;
      font-weight: 600;
      line-height: 1.7;
    }

    .load-description {
      margin: 18px auto 0;
      max-width: 36em;
      color: var(--text);
      font-size: 0.92rem;
      line-height: 1.9;
      text-align: left;
    }

    .reason-list {
      display: grid;
      gap: 12px;
      margin: 0;
      padding: 0;
      list-style: none;
      counter-reset: reason;
    }

    .reason-item {
      position: relative;
      padding: 20px 20px 20px 58px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.48);
      counter-increment: reason;
    }

    .reason-item::before {
      content: counter(reason, decimal-leading-zero);
      position: absolute;
      left: 18px;
      top: 20px;
      color: var(--brass);
      font-family: var(--serif);
      font-size: 0.82rem;
      letter-spacing: 0.08em;
    }

    .reason-item p { margin: 0; }

    .snapshot-grid {
      display: grid;
      gap: 10px;
      margin: 0;
    }

    .snapshot-item {
      display: grid;
      gap: 6px;
      padding: 16px 18px;
      border-top: 1px solid var(--line);
    }

    .snapshot-item:last-child { border-bottom: 1px solid var(--line); }

    .snapshot-heading {
      color: var(--muted);
      font-size: 0.78rem;
      letter-spacing: 0.08em;
    }

    .snapshot-answer {
      color: var(--navy-deep);
      font-family: var(--serif);
      font-size: 0.98rem;
      line-height: 1.7;
    }

    .golden-report { margin-top: 8px; }

    .answer-summary-list {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin: 20px 0 0;
      padding: 0;
      list-style: none;
      counter-reset: answer;
    }

    .answer-summary-list li {
      position: relative;
      padding: 15px 16px 15px 48px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.55);
      color: var(--navy-deep);
      line-height: 1.8;
      counter-increment: answer;
    }

    .answer-summary-list li::before {
      content: counter(answer, decimal-leading-zero);
      position: absolute;
      top: 15px;
      left: 16px;
      color: var(--brass-deep);
      font-family: var(--serif);
      font-size: 0.78rem;
      letter-spacing: 0.06em;
    }

    .answer-question {
      display: block;
      margin-bottom: 3px;
      color: var(--muted);
      font-size: 0.75rem;
      letter-spacing: 0.05em;
    }

    .answer-choice {
      display: block;
      color: var(--navy-deep);
      font-family: var(--serif);
      font-size: 0.98rem;
    }

    .report-question {
      margin: 0 0 18px;
      padding: 17px 18px;
      border-left: 3px solid var(--brass);
      background: var(--brass-soft);
      color: var(--navy-deep);
      font-family: var(--serif);
      font-size: 1.02rem;
      line-height: 1.95;
    }

    .example-label {
      margin: 24px 0 14px !important;
      color: var(--brass-deep);
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .reflection-label {
      margin: 24px 0 8px !important;
      color: var(--brass-deep);
      font-size: 0.84rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .report-conclusion {
      padding: 30px 26px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: linear-gradient(135deg, rgba(18, 42, 61, 0.97), rgba(28, 55, 72, 0.94));
      color: #fff;
      box-shadow: var(--shadow);
    }

    .report-conclusion .eyebrow { color: #d8c28f; }

    .report-conclusion h3 {
      margin: 0 0 20px;
      font-family: var(--serif);
      font-size: clamp(1.3rem, 5vw, 1.72rem);
      font-weight: 600;
      line-height: 1.65;
      letter-spacing: 0.05em;
    }

    .report-conclusion p {
      margin: 0 0 10px;
      color: rgba(255, 255, 255, 0.9);
      line-height: 2;
    }

    .report-conclusion p:last-child { margin-bottom: 0; }

    .report-check-list {
      display: grid;
      gap: 12px;
      margin: 22px 0;
    }

    .report-check-card {
      padding: 18px 17px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.08);
    }

    .report-check-card h4 {
      margin: 0 0 10px;
      color: #e7d39f;
      font-family: var(--serif);
      font-size: 1rem;
      font-weight: 600;
      line-height: 1.65;
    }

    .report-check-card p { margin-bottom: 8px; }
    .report-check-card p:last-child { margin-bottom: 0; }

    .report-check-label {
      color: #e7d39f;
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .limit-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 16px;
    }

    .limit-item {
      padding: 15px 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.55);
    }

    .limit-label {
      display: block;
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 0.73rem;
      letter-spacing: 0.09em;
    }

    .limit-value {
      color: var(--navy-deep);
      font-family: var(--serif);
      font-size: 0.94rem;
      font-weight: 600;
      line-height: 1.6;
    }

    .detail-section {
      padding: 30px 0;
      border-bottom: 1px solid var(--line);
    }

    .report-bridge {
      margin: 22px 0 8px;
      padding: 20px 20px 8px;
      border-left: 3px solid var(--brass);
      background: var(--brass-soft);
    }

    .report-bridge p { margin: 0 0 12px; }

    .detail-section:last-child { border-bottom: none; }

    .detail-section h3 {
      margin: 0 0 16px;
      font-family: var(--serif);
      font-size: 1.2rem;
      font-weight: 600;
      line-height: 1.7;
      letter-spacing: 0.04em;
      color: var(--navy-deep);
    }

    .detail-section p { margin: 0 0 12px; }
    .detail-section p:last-child { margin-bottom: 0; }

    .type-oneliner p,
    .report-bridge p,
    .detail-section h3,
    .detail-section p,
    .report-conclusion h3,
    .report-conclusion h4,
    .report-conclusion p,
    .answer-question,
    .answer-choice,
    .bonus-item h4,
    .bonus-item p,
    .result-actions .btn-secondary {
      line-break: strict;
      overflow-wrap: break-word;
      text-wrap: pretty;
      word-break: auto-phrase;
    }

    .report-list,
    .reflection-list {
      display: grid;
      gap: 10px;
      margin: 18px 0;
      padding: 0;
      list-style: none;
    }

    .report-list li,
    .reflection-list li {
      position: relative;
      padding: 14px 16px 14px 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.5);
      line-height: 1.85;
    }

    .report-list li::before {
      content: "—";
      position: absolute;
      left: 17px;
      color: var(--brass-deep);
    }

    .reflection-list { counter-reset: reflection; }

    .reflection-list li {
      padding-left: 52px;
      counter-increment: reflection;
    }

    .reflection-list li::before {
      content: counter(reflection, decimal-leading-zero);
      position: absolute;
      left: 16px;
      top: 14px;
      color: var(--brass-deep);
      font-family: var(--serif);
      font-size: 0.8rem;
      letter-spacing: 0.06em;
    }

    .report-note {
      margin-top: 18px !important;
      color: var(--muted) !important;
      font-size: 0.92rem;
    }

    .not-now-list {
      display: grid;
      gap: 10px;
      margin: 18px 0 0;
      padding: 0;
      list-style: none;
    }

    .not-now-list li {
      position: relative;
      padding: 12px 14px 12px 38px;
      border: 1px solid rgba(165, 139, 87, 0.24);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.52);
    }

    .not-now-list li::before {
      content: "—";
      position: absolute;
      left: 15px;
      color: var(--brass);
    }

    .action-intro {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .action-card {
      margin-top: 16px;
      padding: 24px 22px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.58);
      break-inside: avoid;
    }

    .action-card.is-primary { border-top: 3px solid var(--brass); }

    .action-card-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: baseline;
      margin-bottom: 14px;
    }

    .action-card h4 {
      margin: 0;
      color: var(--navy-deep);
      font-family: var(--serif);
      font-size: 1.1rem;
      line-height: 1.6;
    }

    .action-time {
      flex: none;
      color: var(--brass-deep);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .action-card p { margin: 0 0 12px; }

    .plan-steps {
      margin: 0;
      padding: 0;
      list-style: none;
      counter-reset: plan-step;
    }

    .plan-steps li {
      display: grid;
      grid-template-columns: 46px 1fr;
      gap: 12px;
      padding: 13px 0;
      border-bottom: 1px solid var(--line);
    }

    .plan-steps li:last-child { border-bottom: none; }
    .step-time { color: var(--brass-deep); font-size: 0.8rem; font-weight: 700; }

    .completion-box,
    .fallback-box {
      margin-top: 16px;
      padding: 14px 16px;
      border-radius: 8px;
      font-size: 0.9rem;
      line-height: 1.8;
    }

    .completion-box { background: rgba(18, 42, 61, 0.07); }
    .fallback-box { border: 1px dashed var(--line-strong); color: var(--muted); }
    .completion-box strong,
    .fallback-box strong { color: var(--navy-deep); }

    .month-timeline {
      display: grid;
      gap: 12px;
      margin-top: 18px;
    }

    .month-step {
      display: grid;
      grid-template-columns: 62px 1fr;
      gap: 14px;
      padding: 16px 0;
      border-bottom: 1px solid var(--line);
    }

    .month-step:last-child { border-bottom: none; }
    .month-step-tag { color: var(--brass-deep); font-family: var(--serif); font-size: 0.86rem; }
    .month-step h5 { margin: 0 0 5px; color: var(--navy-deep); font-size: 0.96rem; }
    .month-step p { margin: 0; font-size: 0.92rem; }

    .bonus-separator {
      margin-top: 64px;
      padding-top: 54px;
      border-top: 4px double var(--line-strong);
    }

    .r-section {
      margin-top: 56px;
    }

    .r-section h3 {
      margin: 0 0 16px;
      padding-top: 14px;
      font-family: var(--serif);
      font-size: 1.18rem;
      font-weight: 600;
      line-height: 1.7;
      letter-spacing: 0.05em;
      color: var(--navy-deep);
    }

    .r-section h3::before {
      content: "";
      display: block;
      width: 26px;
      height: 1px;
      margin-bottom: 14px;
      background: var(--brass);
      opacity: 0.75;
    }

    .r-section .eyebrow + h3 { padding-top: 0; }
    .r-section .eyebrow + h3::before { content: none; }
    .dont-box h3::before { content: none; }

    .r-section p {
      margin: 0 0 12px;
      color: var(--text);
    }

    .r-section p:last-child { margin-bottom: 0; }

    /* axes */
    .axis-row { margin-bottom: 28px; }
    .axis-row:last-child { margin-bottom: 0; }

    .axis-labels {
      display: flex;
      justify-content: space-between;
      margin-bottom: 9px;
      color: var(--muted);
      font-size: 0.8rem;
      letter-spacing: 0.08em;
    }

    .axis-labels .is-strong { color: var(--brass-deep); font-weight: 600; }

    .axis-track {
      position: relative;
      height: 1px;
      border-radius: 0;
      background: var(--line-strong);
    }

    .axis-track::before {
      content: "";
      position: absolute;
      left: 50%;
      top: -5px;
      width: 1px;
      height: 11px;
      background: var(--muted);
      opacity: 0.4;
    }

    .axis-dot {
      position: absolute;
      top: 50%;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--brass);
      border: 3px solid var(--bg);
      box-shadow: 0 0 0 1px var(--brass);
      transform: translate(-50%, -50%);
      transition: left 0.5s ease;
    }

    /* dont box */
    .dont-box {
      padding: 26px 24px;
      border: 1px solid var(--line);
      border-left: 2px solid var(--brass);
      border-radius: 0 var(--radius) var(--radius) 0;
      background: rgba(165, 139, 87, 0.05);
    }

    .dont-box h3 { margin-bottom: 12px; padding-top: 0; }

    /* lists */
    .step-list {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .step-list li {
      position: relative;
      padding: 12px 0 12px 30px;
      border-bottom: 1px solid var(--line);
    }

    .step-list li:last-child { border-bottom: none; }

    .step-list li::before {
      content: "";
      position: absolute;
      left: 6px;
      top: 1.55em;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--brass);
    }

    .month-list { counter-reset: week; }

    .month-list li::before {
      content: none;
    }

    .month-list li {
      padding-left: 0;
      display: grid;
      grid-template-columns: 64px 1fr;
      gap: 12px;
      align-items: baseline;
    }

    .month-list .week-tag {
      color: var(--brass);
      font-family: var(--serif);
      font-size: 0.88rem;
      letter-spacing: 0.08em;
      white-space: nowrap;
    }

    .month-note {
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 0.92rem;
    }

    /* message */
    .last-word {
      margin-top: 56px;
      padding: 40px 8px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      text-align: center;
    }

    .last-word .eyebrow { text-align: center; margin-bottom: 20px; }

    .last-word p {
      margin: 0;
      font-family: var(--serif);
      font-size: 0.94rem;
      line-height: 2.2;
      letter-spacing: 0.04em;
      color: var(--navy-deep);
      word-break: keep-all;
      overflow-wrap: anywhere;
      line-break: strict;
    }

    .diagnosis-complete {
      margin-top: 30px;
      padding: 24px 20px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.5);
      text-align: center;
    }

    .diagnosis-complete .eyebrow {
      margin-bottom: 10px;
      text-align: center;
    }

    .diagnosis-complete p {
      margin: 0;
      font-family: var(--serif);
      color: var(--navy-deep);
      font-size: 1.04rem;
      font-weight: 700;
    }

    .diagnosis-complete small {
      display: block;
      margin-top: 0;
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.8;
    }

    .result-actions {
      display: grid;
      gap: 12px;
      margin-top: 44px;
    }

    .result-actions .btn-secondary {
      padding-right: 10px;
      padding-left: 10px;
      letter-spacing: 0.08em;
      white-space: nowrap;
    }

    .copy-feedback {
      min-height: 24px;
      margin: 0;
      color: var(--brass);
      font-size: 0.85rem;
      text-align: center;
      letter-spacing: 0.06em;
    }

    /* CTA */
    .cta-box {
      margin-top: 22px;
      padding: 32px 26px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.7), rgba(255, 255, 255, 0.45));
      box-shadow: var(--shadow);
    }

    .cta-box p { margin: 0 0 14px; }
    .cta-box p:last-child { margin-bottom: 0; }

    .cta-box h3 {
      margin: 0 0 12px;
    }

    .bonus-list {
      display: grid;
      gap: 12px;
      margin: 24px 0;
      padding: 0;
      list-style: none;
    }

    .bonus-item {
      display: grid;
      grid-template-columns: 38px 1fr;
      gap: 14px;
      align-items: start;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.62);
    }

    .bonus-number {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--navy-deep);
      color: #fff;
      font-family: var(--serif);
      font-size: 0.86rem;
      letter-spacing: 0.04em;
    }

    .bonus-item h4 {
      margin: 0 0 6px;
      color: var(--navy-deep);
      font-family: var(--serif);
      font-size: 1rem;
      line-height: 1.7;
      word-break: keep-all;
      overflow-wrap: anywhere;
      line-break: strict;
    }

    .bonus-item p {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.8;
    }

    .delivery-note {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.88rem;
    }

    .bonus-foundation-note {
      margin-top: 26px;
    }

    .bonus-followup {
      margin-top: 26px;
      padding-top: 24px;
      border-top: 1px solid var(--line);
    }

    .bonus-followup h4 {
      margin: 0 0 14px;
      color: var(--navy-deep);
      font-family: var(--serif);
      font-size: 1.18rem;
      line-height: 1.7;
      letter-spacing: 0.02em;
    }

    .bonus-followup p {
      margin-bottom: 14px;
    }

    .bonus-followup p:last-child {
      margin-bottom: 0;
    }

    .bonus-followup-title {
      white-space: nowrap;
    }

    .site-footer {
      margin-top: 56px;
      padding: 28px 0 10px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.76rem;
      text-align: center;
      letter-spacing: 0.14em;
    }

    .is-hidden { display: none; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .fade-in { animation: fadeIn 0.36s ease both; }

    @media (max-width: 479px) {
      .page { padding: 20px 20px 56px; }
      .site-header .brand-en { font-size: 0.62rem; letter-spacing: 0.2em; }
      .result { padding-top: 36px; }
      .result-hero { padding-right: 20px; padding-left: 20px; }
      .type-name { font-size: 1.45rem; letter-spacing: 0.025em; }
      .result > .r-section,
      #result-body,
      .last-word,
      .diagnosis-complete,
      .result-actions {
        margin-right: 4px;
        margin-left: 4px;
      }
      .cta-box { padding: 26px 18px; }
      .bonus-item {
        grid-template-columns: 34px minmax(0, 1fr);
        gap: 12px;
        padding: 16px 14px;
      }
      .bonus-number { width: 34px; height: 34px; }
      .limit-grid { grid-template-columns: 1fr; }
      .action-card-head { display: block; }
      .action-time { display: block; margin-top: 6px; }
    }

    @media (min-width: 640px) {
      .page { padding: 32px 32px 72px; }
      .intro { padding: 92px 0 52px; }
      .result-hero { padding: 56px 40px 48px; }
      .result-actions { grid-template-columns: repeat(2, 1fr); }
      .result-actions .copy-feedback { grid-column: 1 / -1; }
      .summary-grid { grid-template-columns: 1fr 1fr; }
      .answer-summary-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .snapshot-grid { grid-template-columns: 1fr 1fr; }
      .snapshot-item:last-child { grid-column: 1 / -1; }
      .last-word { padding: 44px 22px; }
      .last-word p { font-size: 1.08rem; }
    }

    @media print {
      @page { size: A4; margin: 14mm 13mm 16mm; }
      body { background: #fff; }
      .page { width: auto; max-width: none; padding: 0; }
      .site-header,
      .result-actions,
      .bonus-separator,
      .site-footer { display: none !important; }
      .result { padding: 0; }
      .result-hero,
      .report-conclusion,
      .action-card,
      .dont-box,
      .diagnosis-complete { box-shadow: none; break-inside: avoid; }
      .report-conclusion {
        background: #fff;
        color: var(--navy-deep);
        border: 2px solid var(--navy-deep);
      }
      .report-conclusion .eyebrow { color: var(--brass-deep); }
      .report-conclusion p { color: var(--text); }
      .report-check-card {
        border-color: var(--line);
        background: #fff;
      }
      .report-check-card h4,
      .report-check-label { color: var(--brass-deep); }
      .r-section,
      .detail-section,
      .last-word { break-inside: avoid; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

function combinations(items, chooseCount) {
  const result = [];
  const chosen = [];
  function visit(startIndex) {
    if (chosen.length === chooseCount) {
      result.push([...chosen]);
      return;
    }
    const lastStart = items.length - (chooseCount - chosen.length);
    for (let index = startIndex; index <= lastStart; index += 1) {
      chosen.push(items[index]);
      visit(index + 1);
      chosen.pop();
    }
  }
  visit(0);
  return result;
}

function selectionMetrics(candidateSet) {
  const counts = new Map();
  for (const candidate of candidateSet) {
    for (const answerId of candidate.requiredAnswerIds) {
      const number = questionNumber(answerId);

    }
  }
  return {
    qualityVector: candidateSet.map(({ qualityPriority }) => qualityPriority).sort((a, b) => a - b),
    questionCoverage: counts.size,
    maxQuestionUse: Math.max(...counts.values()),
    candidateIdVector: candidateSet.map(({ candidateId }) => candidateId).sort()
  };
}

function compareVectors(left, right) {
  for (let index = 0; index < left.length; index += 1) {
    if (left[index] < right[index]) return -1;
    if (left[index] > right[index]) return 1;
  }
  return 0;
}

function compareSets(left, right) {
  const quality = compareVectors(left.metrics.qualityVector, right.metrics.qualityVector);
  if (quality !== 0) return quality;
  if (left.metrics.questionCoverage !== right.metrics.questionCoverage) {
    return right.metrics.questionCoverage - left.metrics.questionCoverage;
  }
  if (left.metrics.maxQuestionUse !== right.metrics.maxQuestionUse) {

          ${section.body.map(renderBodyBlock).join("")}
        </section>
      `).join("");
      const checkCards = report.checks.map((check) => `
        <article class="report-check-card">
          <h4>${check.title}</h4>
          <p><span class="report-check-label">やること</span><br>${formatReportHtml(check.action)}</p>
          <p><span class="report-check-label">あとで見ること</span><br>${formatReportHtml(check.observe)}</p>
        </article>
      `).join("");
      const integratedBridge = report.integratedBridge.length
        ? `<div class="report-bridge">${report.integratedBridge
            .map((paragraph) => `<p>${formatReportHtml(paragraph)}</p>`)
            .join("")}</div>`
        : "";

      document.getElementById("golden-report").innerHTML = `
        <section class="r-section">
          <span class="eyebrow">今回の回答</span>
          <h3>今回選んだ8つの回答</h3>
          <ol class="answer-summary-list">${answerItems}</ol>
        </section>

        <section class="r-section">
          <span class="eyebrow">考えを整理する</span>
          <h3>6つの観点から考えてみる</h3>
          ${integratedBridge}
          ${detailSections}
        </section>

        <section class="report-conclusion">
          <span class="eyebrow">診断を終えた方へ</span>
          <h3>${report.closingHeading}</h3>
          ${report.closing.map((paragraph) => `<p>${formatReportHtml(paragraph)}</p>`).join("")}
          <div class="report-check-list">${checkCards}</div>
          <p>${formatReportHtml(report.closingTail)}</p>
        </section>
      `;

      document.getElementById("golden-title").innerHTML = REPORT_TITLE
        .split(/\s+/)
        .map((segment) => `<span class="title-segment">${segment}</span>`)
        .join(" ");
      document.getElementById("golden-introduction").innerHTML = report.introduction
        .map((paragraph) => `<p>${formatReportHtml(paragraph)}</p>`)
        .join("");
      const disclaimerElement = document.getElementById("result-disclaimer");
      const disclaimerBox = disclaimerElement.closest(".diagnosis-complete");
      if (report.disclaimer) {
        disclaimerElement.textContent = report.disclaimer;
        disclaimerBox.style.display = "";
      } else {
        disclaimerElement.textContent = "";
        disclaimerBox.style.display = "none";
      }
      renderCommonBonus();
    }

    function showResult() {
      const goldenShell = document.getElementById("golden-result-shell");

      goldenShell.classList.remove("is-hidden");

      document.getElementById("bonus-section").classList.remove("is-hidden");

      currentReport = resolveCompleteReport(toAnswerIds(answers));
      renderCompleteReport(currentReport);

      document.getElementById("copy-feedback").textContent = "";
      showScreen(screenResult);
      screenResult.classList.add("fade-in");
      document.getElementById("golden-title").focus({ preventScroll: true });
    }

    function buildCopyText() {
      if (!currentReport) return "";
      const sectionText = currentReport.sections.flatMap((section) => [
          `【${section.heading}】`,
          "",
          ...section.body.flatMap((block) => [
            block.type === "label" ? `＜${block.text}＞` : block.text,
            ""
          ])
        ]);

        return [
          "【スマートFIRE自己理解レポート】",
          ...currentReport.introduction.flatMap((paragraph) => [paragraph, ""]),
          "【今回選んだ8つの回答】",
          ...currentReport.answers.map((answer) => `・${answer.question}：${answer.text}`),
          "",
          ...currentReport.integratedBridge.flatMap((paragraph) => [paragraph, ""]),
          ...sectionText,
          `【${currentReport.closingHeading}】`,
          ...currentReport.closing.flatMap((paragraph) => [paragraph, ""]),
          ...currentReport.checks.flatMap((check) => [
            `＜${check.title}＞`,
            `やること：${check.action}`,
            `あとで見ること：${check.observe}`,
            ""
          ]),
          currentReport.closingTail,
          "",
          currentReport.disclaimer
        ].join("\n").trim();
    }

    async function copyResult() {
      const text = buildCopyText();
      const feedback = document.getElementById("copy-feedback");
      try {
        await navigator.clipboard.writeText(text);
        feedback.textContent = "コピーしました";
      } catch (error) {
        const textarea = document.createElement("textarea");
        textarea.value = text;
        textarea.setAttribute("readonly", "");
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";
        document.body.appendChild(textarea);
        textarea.select();
        try {
          const copied = document.execCommand("copy");
          feedback.textContent = copied
            ? "コピーしました"
            : "コピーできませんでした。スクリーンショットでの保存をどうぞ";
        } catch (fallbackError) {
          feedback.textContent = "コピーできませんでした。スクリーンショットでの保存をどうぞ";
        }
        document.body.removeChild(textarea);
      }
      window.setTimeout(() => { feedback.textContent = ""; }, 2600);
    }

    function startQuiz() {
      if (transitionTimerId !== null) {
        window.clearTimeout(transitionTimerId);
        transitionTimerId = null;
      }
      isTransitioning = false;
      answers = [];
      currentReport = null;
      currentIndex = 0;
      showScreen(screenQuiz);
      renderQuestion();
    }

    document.getElementById("start-button").addEventListener("click", startQuiz);
    document.getElementById("restart-button").addEventListener("click", startQuiz);
    document.getElementById("retry-button").addEventListener("click", startQuiz);
    document.getElementById("copy-button").addEventListener("click", copyResult);
    backButton.addEventListener("click", () => {
      if (isTransitioning) return;
      if (currentIndex > 0) {
        currentIndex -= 1;
        renderQuestion();
      }
    });

    renderIntro();
  </script>
</body>
</html>
